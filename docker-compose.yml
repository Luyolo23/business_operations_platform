# Local PostgreSQL for development.   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: ops-postgres
    environment:
      POSTGRES_DB: opsdb
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
    ports:
      - "5432:5432"
    volumes:
      - ops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d opsdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ops-pgdata:
