server {
    # Non-root nginx cannot bind port 80; the container publishes this on 8081.
    listen       8080;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Baseline browser protections. These are inherited by every location that
    # does not declare its own add_header directives.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Proxy /api/* to the backend service (name matches docker-compose service).
    # Resolve at request time via Docker's embedded DNS so nginx still starts
    # when the backend container is temporarily absent.
    location /api/ {
        resolver           127.0.0.11 ipv6=off valid=10s;
        set $backend_host  backend:8080;
        proxy_pass         http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: any path not matched by a real file returns index.html
    # so React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames). `expires` sets
    # Cache-Control without an add_header, so the security headers still apply.
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 1y;
    }
}
